<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>联系我们 - Aura Lens</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="container nav-container">
            <div class="logo">
                <h1><a href="index.html">Aura Lens</a></h1>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html">首页</a></li>
                    <li><a href="features.html">探索 Aura</a></li>
                    <li><a href="technology.html">Aura揭秘</a></li>
                    <li><a href="contact.html">联系我们</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="page-title-section">
            <div class="container">
                <h2 class="page-title">保持联系。</h2>
            </div>
        </section>

        <section class="contact-intro">
            <div class="container">
                <p>对 Aura Lens 有任何疑问，或想了解更多关于投资及合作机会的信息？请随时与我们联系。</p>
            </div>
        </section>

        <section class="contact-form-section fade-in-section">
            <div class="container">
                <form action="#" method="POST" class="contact-form">
                    <div class="form-group">
                        <label for="name">姓名</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">邮箱</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="message">留言</label>
                        <textarea id="message" name="message" rows="5" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">发送消息</button>
                </form>
            </div>
        </section>

        <section class="social-media-links">
            <div class="container" style="text-align: center;">
                <h3>关注我们</h3>
                <!-- Placeholder for social media icons/links -->
                <p>
                    <a href="#">推特</a> | 
                    <a href="#">领英</a> | 
                    <a href="#">照片墙</a>
                </p>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2024 Aura Lens. 版权所有。</p>
            <p><a href="#">隐私政策</a> | <a href="#">使用条款</a></p>
        </div>
    </footer>
    <script src="js/main.js"></script>
</body>
</html>
